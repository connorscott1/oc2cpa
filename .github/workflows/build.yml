name: Reviewed build
on:
  pull_request:
  push:
    branches: [main, harden-pinned-builds]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: false
      - run: python3 scripts/check-pins.py
      - run: python3 .github/scripts/validate-registry.py registry.json
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go test -mod=readonly -race ./...
      - run: go vet -mod=readonly ./...
  build:
    needs: test
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
          - runner: windows-2025
            target: windows_amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: false
      - run: go test -mod=readonly ./...
      - run: python3 scripts/build.py
      - run: python3 scripts/smoke-abi.py
      - name: Smoke test exact CLIProxyAPI v8.0.44
        if: matrix.target == 'linux_amd64'
        run: python3 scripts/smoke-host.py --download
      - name: Attest committed artifacts
        if: github.event_name == 'push' && github.repository == 'connorscott1/oc2cpa'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: 'dist/**/*.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oc2cpa-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/**/*.zip
            dist/**/*.build.json
            dist/**/checksums.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'connorscott1/oc2cpa'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify tag matches reviewed version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: oc2cpa-*-${{ github.sha }}
          merge-multiple: false
      - name: Assemble release
        run: python3 scripts/assemble-release.py
      - name: Create new draft; existing releases must never be replaced
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing replacement.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "OC2CPA $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md release-out/*
